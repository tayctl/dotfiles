set -g base-index 1
set-option -g focus-events on

set -g mouse on

set-window-option -g mode-keys vi

# Vim bindings for pane switching
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# Opens new windows in the same directory
bind c new-window -c "#{pane_current_path}"

# removes the time
set -g status-right ""

# theming less loud
set -g status-style bg=default,fg=green

# fcd in a popup with prefix + f (keeps C-f free for nvim/shell)
bind f display-popup -E -w 80% -h 70% "~/.local/bin/fcd"

# --- Plugins (keep at bottom) ---
# Save/restore sessions across reboots: resurrect does save (prefix C-s) /
# restore (prefix C-r); continuum autosaves every 15 min and restores on start.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Bootstrap TPM + plugins on a fresh machine
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
