git:
  pagers:
    - pager: delta --dark --paging=never
      colorArg: always
  commit:
    signOff: true
  truncateCopiedCommitHashesTo: 7

customCommands:
  - key: 'U'
    context: 'global'
    description: 'Update all submodules recursively'
    command: 'git submodule update --init --recursive'
    loadingText: 'Updating submodules...'
