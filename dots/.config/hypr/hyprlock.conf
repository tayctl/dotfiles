source = ~/.local/state/theme/hyprlock.conf

background {
    path = Pictures/Wallpaper/earthset.jpg
    blur_passes = 0 
}

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_size = 96
    font_family = BlexMono Nerd Font
    
    position = 0, 15%
    halign = center
    valign = center
}

shape {
    monitor =
    size = 22%, 12%
    color = $lock_panel
    rounding = 15
    
    position = 0, 15%
    halign = center
    valign = center
}

input-field {
    monitor =
    font_family = BlexMono Nerd Font
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $lock_inner
    outer_color = $lock_outer
    check_color = $lock_check
    fail_color = $lock_fail
    font_color = $lock_text
    fade_on_empty = false
    rounding = 15
    
    position = 0, 0
    halign = center
    valign = center
}
