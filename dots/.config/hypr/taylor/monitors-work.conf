# Work laptop (HP ZBook Studio 16 G11), mostly docked to a 4K BenQ RD320U.
# kanshi (~/.config/kanshi/config, from home/work.nix) disables eDP-1 while
# an external monitor is connected; these rules are the fallback.

monitor = eDP-1, preferred, auto, 1.5
monitor = , preferred, auto, 1.5

exec-once = kanshi
