#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle
exec-once = waybar
exec-once = udiskie --tray
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start filen-automount.service
exec-once = pika-backup-monitor
exec-once = nm-applet --indicator
exec-once = blueman-tray

####################
### STARTUP APPS ###
####################

exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] $browser
exec-once = [workspace 3 silent] signal-desktop
exec-once = [workspace 4 silent] $fileManager
# exec-once = [workspace 8 silent] bitwarden-desktop
# exec-once = [workspace 9 silent] pika-backup
# exec-once = [workspace 10 silent] thunderbird
